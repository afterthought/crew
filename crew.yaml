# The teams. A team is where it runs and which repositories it works in; everything about how work is done in a
# repository is in that repository's CLAUDE.md, whose `## Crew` section the briefs point every role to.
#
#   name     <code>-<number>: brd-1, brd-2. Its agents are <name>-conductor, <name>-coder-1, and so on, and its herdr
#            workspace carries the name
#   machine  a host in ~/.config/swancloud/herdr-hosts.json
#   session  a herdr session on that host; the repositories are <session folder>/<repo>/main
#   repos    the kit, where changes are written and built, then the design repository fable writes in
#   base     the branch coders branch from and merge to, when a team is not the only one on its kit (default main)
teams:
  - name: swb-1
    system: Switchboard
    machine: mac-studio
    session: willdan
    coders: 2
    repos: [switchboard-kit, willdan-blueprints]

  - name: brd-1
    system: Breadboard
    machine: mac-studio
    session: willdan
    coders: 2
    repos: [breadboard-kit, willdan-blueprints]
