# moon runs crew's suite: one project, tests, whose tasks are one per tests/t-*.sh, generated into tests/moon.yml by
# tests/moon-tasks and run side by side by tests/suite. A task whose inputs are identical to a run that passed on
# this host, in any worktree of crew, is replayed from the archives in .moon/cache/outputs (a link into the git
# common dir, made by devenv.nix) instead of run again. So every task's inputs must name everything its test reads
# from crew's tree: a file left out could change and a stale pass replay. tests/suite refuses while they don't.
$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  tests: 'tests'

# --affected compares against the merge-base with main, uncommitted edits included.
vcs:
  client: 'git'
  defaultBranch: 'main'

# Nothing phones home.
telemetry: false

# Python writes __pycache__ under plugin/ while tests run; those files are no test's input.
hasher:
  ignorePatterns: ['**/__pycache__/**']
