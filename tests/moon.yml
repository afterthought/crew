# Written by tests/moon-tasks from tests/t-*.sh and the pytest tiers; never edited by hand. After adding or removing a test, or changing
# what one reads (its `# Reads:` line), run tests/moon-tasks and commit this file: tests/suite refuses to run while
# it is out of step. One task per tier and per end-to-end test, the live test left out; tests/moon-tasks says what
# each task's inputs are.
