# crew's policy for sluice, read from each branch's own revision: what crew's toolchain and tests are, which crew reads
# when it makes a worktree of crew ready (plugin/lib/kit.py, plan.17), and what gates a merge into a bolt and a landing
# on main. Every merge into crew's branches is a submission (record 0026): units, chores and fixes `wt submit
# bolt/<bolt>`, main-level ops's landing `crew bolt submit <bolt>`; nothing else moves them (teams.5, plan.8).
[tests]
toolchain = ["devenv", "print-dev-env"]
runner = "moon"

[checkout]
method = "git-worktree"

# crew's tests run open on the host, as they run in a worktree (the user, 2026-10-13: "On the host for now"): they write
# the host's test slots, ~/.cache/crew/test-slots (tests.9), and moon's archives in the git common dir, both outside the
# checkout sluice's sandbox confines writes to.
[executor]
kind = "open"

# A merge into a bolt and a landing each take every check-full task, run open and afresh: neither trusts a replay
# (tests.5, tests.10).
[branches."bolt/*"]
required = ["#check-full"]
trust = ["open"]

[branches.main]
required = ["#check-full"]
trust = ["open"]
