# crew's policy for sluice, read from each branch's own revision: what crew's toolchain and tests are, which crew reads
# when it makes a worktree of crew ready (plugin/lib/kit.py, plan.17), and what gates a merge into a bolt and a landing
# on main. Every merge into crew's branches is a submission (record 0026): units, chores and fixes `wt submit
# bolt/<bolt>`, main-level ops's landing `crew bolt submit <bolt>`; nothing else moves them (teams.5, plan.8).
[tests]
toolchain = ["devenv", "print-dev-env"]
runner = "moon"

# crew's tests run open on the host, as they run in a worktree (the user, 2026-10-13: "On the host for now"): they write
# the host's test slots, ~/.cache/crew/test-slots (tests.9), and moon's archives in the git common dir, both outside the
# checkout sluice's sandbox confines writes to.
[executor]
kind = "open"

# A merge into a bolt and a landing each take the required check-full tasks the change affects, run open and afresh:
# neither trusts a replay, and a change that affects none lands with nothing run (sluice ADR 0044; tests.5, tests.10).
# A run takes about two minutes and has taken seven on a loaded host, so one past twenty is stuck and is ended rather
# than holding the queue for sluice's default hour; a task that both passes and fails on the same tree fails.
[branches."bolt/*"]
required = ["#check-full"]
flaky = "fail"
timeout = "20m"
trust = ["open"]

# main lives on GitHub (swancloud ADR 0027): every round fetches it from origin and forms on it, and a landing is a push
# leased on where the round found it, as the host's [forge] app, the ruleset's only bypass. Ops's landing,
# `crew bolt submit`, opens a pull request that joins the queue once out of draft: it waits on no review or check of
# GitHub's, since the user's word on the bolt's landing card is the approval (plan.16). Bolts stay on the host.
[branches.main]
remote = "origin"
required = ["#check-full"]
flaky = "fail"
timeout = "20m"
trust = ["open"]

[branches.main.pull_requests]
reviews = 0
checks = []
