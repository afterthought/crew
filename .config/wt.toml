# crew's merges are gated by worktrunk's hooks, and agents do not run them by hand.
#
# Both run the suite as `tests/suite` does: one moon task per test file, side by side, and a test whose inputs
# are identical to a run that already passed on this host, in any worktree of crew, is replayed rather than run
# again. So the gate replays what the coder already passed when the rebase changed nothing, and the verification
# replays what the gate passed.
#
# `[pre-merge]` runs crew's whole suite: `tests/suite` inside crew's devenv, with `CREW_TEST_LIVE` emptied, so the
# gate's command says it never runs live whatever the merging shell has set (the live test is no task). It runs in
# the worktree being merged, after the rebase and before the target moves, on the exact tree the merge is about to
# land: a unit's or a fix's merge into its bolt, and a bolt's merge onto main, alike. A red suite refuses the merge
# with nothing landed, and the output names each failing test. A merge onto main runs every test afresh, none
# replayed (`--gate main`), so a landing never rests on a replay of a task whose inputs missed something (tests.10).
#
# `[post-merge]` runs, once a merge has landed, in the background in the target's worktree: `bolt-verify.sh` runs
# the whole suite again, on a frozen copy of the revision a bolt now holds made a one-commit git repository,
# detached, and records its outcome per revision under the git common dir. That is the bolt's verification, which ops reads with
# `sh .config/hooks/bolt-status.sh` from the bolt's worktree; red is a fix. A merge onto main starts none.
#
# Agents never run these hooks with `wt hook`, and never bypass them with `--no-hooks` or `--yes`. The first
# merge on a host waits for the user's one-time `wt config approvals add` in crew, asked again whenever a
# command here changes; keep each command one string, so an approval matches it. Both hooks enter crew's devenv
# shell themselves, because worktrunk runs them for whoever merges, in a shell or not. ops runs a bolt's
# verification again with `sh .config/hooks/bolt-verify.sh` from the bolt's worktree, in the shell its session is in.

[pre-merge]
suite = "devenv shell -- env CREW_TEST_LIVE= tests/suite --gate {{ target }}"

[post-merge]
verify = "devenv shell -- sh .config/hooks/bolt-verify.sh {{ target }}"
