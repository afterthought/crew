<!doctype html>
<!-- crew's page: page.py puts the partitions' links and the flywheel's data in the two placeholders below and writes
     the file whole. It opens on the partition's board; its lineage is the flow view, and its deploys, by environment,
     the deploys view, each one switch away. A click or Enter on any item of the board or a deploy of the deploys view
     opens its dock over the board, the page page.py made
     for it (D.docks); the dock answers nothing, and its last section takes a word to the item's agent, posted to the
     page's own address on Send, the one request the page makes. Everything it draws is in this file: no font, script or
     style is loaded from anywhere, and the only links are to the fleet page and the other partitions' pages beside it.
     Every label, and every answer to a word, is set as text, never as markup. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crew</title>
<style>
/* The page and its board view are styled as the flywheel mockup's phases view, agentplot/blueprints
   design/flywheel-next/mockups/rail-and-board.html: its colour tokens, light and dark (lines 232 to 248), its base rules
   (251 to 256), the header (263, 267), the hosts strip (281 to 291), .dot (351, 356), the segmented control (365 to
   367), .lanes and .lane with Bolt plan's hatch (371, 431 to 439), .sec-h and .empty (440 to 442), .sheet and .slip (512
   to 535), .ledger (574 to 599), .record (614 to 626), .quote (627 to 633), .marks and .mark (666 to 669), and the
   phone's .lanes and .lane (from 1016: 1035, 1044); and its dock, borrowed and not its file: .scrim, .dock, .dk-h with
   its forms, .dk-b, .sec, .rows, .row, .kv and .tl (772 to 826, its --dock and --shadow from 238), and the phone's dock
   (1052), with no foot, since the dock answers nothing; its last section, the word to the item's agent, is the page's
   own. Its web fonts give way to their system fallbacks, and the
   sheet's minimum height is dropped. Every item that opens a dock takes the pointer. A restyle starts there. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#16202A; --ink2:#4A5763; --ink3:#7A8794;
  --line:#D5DBE1; --line2:#E4E8EC; --accent:#0B6E79; --accent-ink:#FFFFFF; --accent-soft:#D9EEF0; --accent-hatch:rgba(11,110,121,.10);
  --ok:#2E8B57; --warn:#B7791F; --crit:#B3362B; --lit:#FFF3C4; --lit-line:#E5C34A;
  --shadow:0 10px 30px rgba(22,32,42,.16); --top:46px; --hosts:40px; --dock:600px;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--sans);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input:focus,textarea:focus,select:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
.mono{font-family:var(--mono)}

/* ---------- the header ---------- */
.top{flex:none;min-height:var(--top);display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .meta{margin-left:auto;color:var(--ink3);font-size:12px;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.parts{display:flex;flex-wrap:wrap;gap:2px}
.parts .part{padding:2px 6px;border-radius:4px;font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink3);text-decoration:none;white-space:nowrap}
.parts a.part:hover{color:var(--ink);background:var(--surface2)}
.parts .part[aria-current]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);border-radius:4px 4px 0 0}
.parts .fleet{font-size:12px;font-weight:600;color:var(--accent);margin-right:6px}

/* ---------- the board view ---------- */
#view-board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hosts{flex:none;min-height:var(--hosts);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:4px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.hosts .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-right:4px;white-space:nowrap}
.host{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 6px;font-size:12px;white-space:nowrap}
.host .hn{font:600 12px var(--mono)}
.host .hm{color:var(--ink3)}
.host.gone{border-color:var(--warn)}
.host.gone .hm b{color:var(--warn)}
.hosts .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.hosts .mark{white-space:normal;overflow-wrap:anywhere}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.gone{background:var(--crit)}
.lanes{flex:1;min-height:0;overflow-x:auto;display:grid;grid-template-columns:minmax(225px,.95fr) minmax(185px,.6fr) minmax(330px,1.45fr) minmax(215px,.9fr)}
.lane{overflow:auto;padding:10px 10px 60px;border-right:1px solid var(--line2)}
.lane:last-child{border-right:0}
.lane.plan{background:repeating-linear-gradient(-45deg,transparent 0 8px,var(--accent-hatch) 8px 9px),var(--bg);border-left:1px dashed var(--line);border-right:1px dashed var(--line)}
.lane-h{display:flex;align-items:baseline;gap:8px;margin:2px 2px 10px;flex-wrap:wrap}
.lane-h h2{font-size:14px;font-weight:800;letter-spacing:-.01em}
.lane-h .sub{font-size:11.5px;color:var(--ink3)}
.lane-h .n{margin-left:auto;font:600 11px var(--mono);color:var(--ink3)}
.lane-h .gate{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 5px}
.lane-h .ro{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:14px 2px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.sec-h .r{letter-spacing:0;text-transform:none;font-weight:500;font-size:11.5px}
.empty{color:var(--ink3);font-size:12.5px;padding:6px 4px}
/* a signal: no box, the quotation and its left rule; who captured them counted above */
.counter{margin:12px 2px 0;font:600 11px var(--mono);color:var(--ink2)}
.counter:first-child{margin-top:0}
.quote{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:7px 0 4px;font-size:12px;color:var(--ink2)}
.quote q{quotes:"“" "”";font-style:italic;color:var(--ink)}
.quote .qm{display:block;font:11px var(--mono);color:var(--ink3);margin-top:3px}
.quote .qm b{color:var(--ink2);font-weight:500}
.quote .qm .dim{opacity:.65}
/* an exploration: its kit greyed, its name, its first line */
.xp{padding:4px 2px 6px;border-bottom:1px solid var(--line2);font-size:12px}
.xp .xp-kit{font:11px var(--mono);color:var(--ink3);margin-right:6px}
.xp .xp-n{font-weight:700}
.xp .xp-t{color:var(--ink2)}
/* sheet: a document (a proposal); title line, section rules, mono metadata */
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink2);border-radius:1px;padding:10px 12px 9px;margin:0 8px 14px 4px;box-shadow:3px 3px 0 var(--line2);display:flex;flex-direction:column}
.sheet .sh-k{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.sheet .sh-title{font-family:var(--sans);font-size:15px;font-weight:800;letter-spacing:-.01em;border-bottom:1px solid var(--ink);padding:1px 0 4px;margin-bottom:5px;line-height:1.2}
.sheet .sh-meta{font:11px var(--mono);color:var(--ink3);line-height:1.5}
/* slip: a queued unit, hanging off the head above it */
.slip{position:relative;margin:-8px 8px 12px 30px;background:var(--surface2);border:1px solid var(--line);border-left:0;border-radius:0 3px 3px 0;padding:5px 9px 6px;font-size:12px}
.slip::before{content:"";position:absolute;left:-16px;top:-8px;width:15px;height:18px;border-left:2px solid var(--ink3);border-bottom:2px solid var(--ink3);border-radius:0 0 0 8px}
.slip::after{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:2px;background:var(--ink3);border-radius:1px}
.sec-h+.slip{margin-top:10px}
.slip .sl-k{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-right:6px}
.slip .sl-repo{font:11px var(--mono);color:var(--ink3);margin-right:6px}
.slip .sl-n{font-weight:700;font-size:12.5px}
.slip .sl-to{display:block;font:11px var(--mono);color:var(--ink2);margin-top:2px}
/* ledger: a bolt is a machine; flat, square, units as a chain left to right */
.ledger{background:var(--surface2);border:1px solid var(--ink3);border-radius:0;margin-bottom:12px;font-size:12px}
.ledger .lg-head{display:flex;align-items:baseline;gap:8px;padding:5px 9px;background:var(--surface);border-bottom:1px solid var(--ink3);font:600 12px var(--mono)}
.ledger .lg-head .lg-repo{color:var(--ink3);font-weight:400}
.ledger .lg-head .lg-run{margin-left:auto;font-weight:400;color:var(--ink2);white-space:nowrap}
.ledger .lg-chain{display:flex;flex-wrap:wrap;align-items:flex-start;padding:8px 6px 4px}
.ledger .lg-unit{border:1px solid var(--line);background:var(--surface);padding:3px 7px;font:11.5px var(--mono);white-space:nowrap;max-width:100%;margin-bottom:4px}
.ledger .lg-unit.merged{color:var(--ink3);background:transparent}
.ledger .lg-unit.merged::before{content:"✓ ";color:var(--ok)}
.ledger .lg-unit.building{border:1.5px solid var(--accent);color:var(--ink);white-space:normal;flex-basis:100%;padding:3px 5px 5px;min-width:0}
.ledger .lg-unit.building .lg-un{font-weight:700}
.ledger .lg-unit.building .lg-ut{color:var(--ink3);margin-left:6px}
.ledger .lg-unit.queued{border-style:dashed;color:var(--ink2)}
.ledger .lg-unit.queued .lg-ut{color:var(--ink3);margin-left:6px}
.ledger .lg-unit .lg-at{display:block;color:var(--ink3);font-size:11px}
.ledger .lg-arrow{color:var(--ink3);font:11px var(--mono);padding:3px 4px;margin-bottom:4px}
.ledger .lg-mach{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 9px;border-top:1px dashed var(--ink3);font:11px var(--mono);color:var(--ink3)}
.ledger .lg-mach .lg-fn{color:var(--ink2);font-weight:600}
.ledger .lg-foot{display:flex;gap:10px;padding:5px 9px;border-top:1px solid var(--ink3);font:11px var(--mono);color:var(--ink3);overflow:hidden;background:var(--surface)}
.ledger .lg-foot .ep{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledger .marks{padding:0 9px 8px;margin-top:6px}
.ledger .lg-unit .marks{padding:0;margin-top:4px}
/* record: a landed bolt is history; no border, muted, its landing as a stamp */
.record{padding:8px 4px 10px;margin-bottom:2px;border-bottom:1px solid var(--line2);color:var(--ink2);background:transparent}
.record .rc-head{display:flex;align-items:baseline;gap:8px}
.record .rc-name{font-weight:600;color:var(--ink2);font-size:13px}
.record .rc-at{margin-left:auto;font:11px var(--mono);color:var(--ink3);white-space:nowrap}
.record .rc-stamp{display:inline-block;margin:6px 0 2px;border:1.5px solid var(--ink3);border-radius:3px;padding:1px 7px;font:700 10.5px var(--mono);letter-spacing:.06em;color:var(--ink3);transform:rotate(-2deg);opacity:.85;text-transform:uppercase}
.record .rc-env{font:11px var(--mono);color:var(--ink3);margin-top:3px}
.rc-stamp.ok{color:var(--ok);border-color:var(--ok)} .rc-stamp.failed{color:var(--crit);border-color:var(--crit)}
.rc-stamp.wait{color:var(--accent);border-color:var(--accent)}
/* a marker: every decision sits on its object */
.marks{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mark{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--surface2)}
.mark .mk-t{font-weight:500}
.mark.approve{color:var(--accent);border-color:var(--accent)} .mark.attention{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
/* long names and addresses break rather than run past the edge */
.sh-title,.sh-meta,.sl-n,.sl-to,.lg-name,.lg-un,.lg-at,.lg-mach,.rc-name,.rc-env,.quote,.xp,.counter,.mark{overflow-wrap:anywhere}
/* every item that opens a dock */
[data-dock]{cursor:pointer}
.quote[data-dock]:hover,.sheet[data-dock]:hover,.slip[data-dock]:hover,.record[data-dock]:hover,.dp[data-dock]:hover{border-color:var(--ink3)}
.lg-unit[data-dock]:hover,.lg-mach[data-dock]:hover{border-color:var(--accent)}

/* ---------- the dock: one panel over the right of the board, slid in, so nothing under it moves ---------- */
.scrim{position:absolute;inset:0;background:transparent;display:none;z-index:8}
body.docked .scrim{display:block}
.dock{position:absolute;top:0;right:0;bottom:0;width:min(var(--dock),calc(100% - 200px));background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:9;display:flex;flex-direction:column;transform:translateX(102%);visibility:hidden;transition:transform .2s cubic-bezier(.2,.7,.3,1),visibility 0s .2s}
body.docked .dock{transform:none;visibility:visible;transition:transform .2s cubic-bezier(.2,.7,.3,1)}
.dock:focus{outline:none}
.dk-h{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.dk-h.dk-sheet{border-top:3px solid var(--ink2);background:var(--surface)} .dk-h.dk-sheet h2{border-bottom:1px solid var(--ink);padding-bottom:5px} .dk-h.dk-sheet .tail{font:11.5px var(--mono)}
.dk-h.dk-slip{background:var(--surface2);box-shadow:inset 4px 0 0 var(--ink3)}
.dk-h.dk-ledger{background:var(--surface2);border-bottom:1px solid var(--ink3);border-top:1px solid var(--ink3)} .dk-h.dk-ledger h2{font-family:var(--mono);font-size:16px;letter-spacing:0}
.dk-h.dk-record{background:transparent;border-bottom:1px solid var(--line2)} .dk-h.dk-record h2{color:var(--ink2);font-weight:600}
.dk-h .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3)}
.dk-h .row .kind{font-weight:700;color:var(--ink2)}
.dk-h .nav{margin-left:auto;display:flex;align-items:center;gap:6px}
.dk-h .back{font:600 12px var(--mono);color:var(--accent);padding:0 4px}
.dk-h .back.solo{display:none}
.dk-h .x{font-size:18px;line-height:1;color:var(--ink3);padding:0 4px}
.dk-h h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-top:6px;overflow-wrap:anywhere}
.dk-h .tail{color:var(--ink2);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.dk-b{flex:1;overflow:auto;padding:6px 16px 20px}
.dock .sec{padding:12px 0;border-bottom:1px solid var(--line2)}
.dock .sec:last-child{border-bottom:0}
.dock .sec h3,.dock .word h3{display:flex;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:8px}
.dock .rows{display:flex;flex-direction:column;gap:4px}
.dock .rows .row,.dock .rows .lk{display:block;font-size:12.5px;padding:4px 0;text-align:left;overflow-wrap:anywhere}
.dock .lk{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:2px;text-align:left;overflow-wrap:anywhere}
.dock .lk:hover{text-decoration-color:var(--accent)}
/* a dock's word to its item's agent, its last section: whom it goes to, a field and Send, and what came back */
.dock .word{padding:12px 0}
.dock .word .to{font-size:12px;color:var(--ink2);margin-bottom:6px;overflow-wrap:anywhere}
.dock .word form{display:flex;gap:6px}
.dock .word input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.dock .word button{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.dock .word input:disabled,.dock .word button:disabled{opacity:.5;cursor:default}
.dock .word .said{font-size:12px;color:var(--ink2);margin-top:6px;overflow-wrap:anywhere}
.dock .word .said:empty{display:none}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0;font-size:12.5px}
.kv dt{font:500 11.5px var(--mono);color:var(--ink3)} .kv dd{margin:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:86px 110px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.tl time{font:11px var(--mono);color:var(--ink3)}
.tl .who{font-weight:600;color:var(--ink2);overflow-wrap:anywhere}
.tl .who i{display:block;font:10px var(--mono);font-style:normal;color:var(--ink3);letter-spacing:.04em}
.tl .what{overflow-wrap:anywhere} .tl li.fail .what{color:var(--crit)}

@media (max-width:759px){
  :root{--hosts:38px}
  html,body{height:auto}
  body{display:block;overflow:visible}
  .top{gap:6px 8px;padding:6px 10px}
  .top .meta{margin-left:0;flex-basis:100%}
  #view-board{display:block}
  .lanes{grid-template-columns:1fr;grid-auto-rows:auto;overflow:visible}
  .lane{overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding-bottom:16px}
  .ledger .lg-head{flex-wrap:wrap}
  .ledger .lg-head .lg-run{margin-left:0;white-space:normal}
  .ledger .lg-unit{white-space:normal}
  .ledger .lg-foot .ep{white-space:normal;overflow-wrap:anywhere}
  .record .rc-head{flex-wrap:wrap}
  #view-board{overflow:visible}
  .dock{width:100%;position:fixed;top:0;bottom:0;left:0;right:0}
  body:not(.docked) .dock{display:none}
  .dk-h .back.solo{display:inline-flex}
  .tl li{grid-template-columns:70px 1fr}
  .tl li .what{grid-column:1/-1}
  #view-flow{overflow:visible}
  #view-deploys{overflow:visible}
  .dp-envs{grid-template-columns:1fr}
}

/* ---------- the deploys view: each environment's deploys as a timeline, oldest at the top ---------- */
#view-deploys{flex:1 1 auto;min-height:0;overflow:auto;padding:14px}
.dp-envs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.dp-env h2{font-size:14px;font-weight:800;margin:0 0 10px;font-family:var(--mono)}
.dp-line{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.dp{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin:0 0 12px;font-size:12.5px;overflow-wrap:anywhere}
.dp::before{content:"";position:absolute;left:-20px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--ink3);border:2px solid var(--bg)}
.dp.ok::before{background:var(--ok)} .dp.failed::before{background:var(--crit)} .dp.wait::before{background:var(--accent)} .dp.replaced{opacity:.7}
.dp-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font:600 12px var(--mono)}
.dp-head .dp-at{margin-left:auto;font-weight:400;color:var(--ink3)}
.dp-head .rc-stamp{border:1.5px solid var(--ink3);border-radius:3px;padding:0 6px;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.dp-word{margin-top:4px;color:var(--ink2)}
.dp-word.wait{color:var(--accent);font-weight:600}
.dp-k{display:block;margin-top:8px;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.dp-steps{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dp-step{font:11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--ink2)}
.dp-step.failed{color:var(--crit);border-color:var(--crit)} .dp-step.ok{color:var(--ok);border-color:var(--ok)}
.dp ul{margin:4px 0 0;padding-left:16px}
.dp li{margin:2px 0}
.dp .dp-n{font:11px var(--mono);color:var(--ink3)}
.dp-why{color:var(--ink3);font-style:italic}
.dp-empty{color:var(--ink3)}

/* ---------- the flow view: the lineage, with its own colours ---------- */
#view-flow {
  color-scheme: light dark;
  --bg: #f7f7f5; --fg: #1d1d1f; --muted: #66666c; --card: #ffffff; --border: #d9d9de; --line: #b9b9c0;
  --mark: #2f62c9; --open: #2f62c9; --flight: #b8720a; --done: #2b7d4f; --dropped: #8a8a90; --unknown: #c4c4ca;
  --warn: #a8261b; --bar: #c9ccd4;
}
@media (prefers-color-scheme: dark) {
  #view-flow {
    --bg: #151517; --fg: #e9e9eb; --muted: #9c9ca3; --card: #1f1f23; --border: #34343b; --line: #4d4d55;
    --mark: #7ea6ff; --open: #7ea6ff; --flight: #e5a640; --done: #62c48d; --dropped: #8a8a90; --unknown: #5c5c63;
    --warn: #ff8f84; --bar: #3d4049;
  }
}
#view-flow { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#view-flow h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
#view-flow code, #view-flow .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
#unreachable { margin: 0; padding: 0; list-style: none; color: var(--warn); }
#controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 0 0 12px; }
#controls input[type=search] { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--card); color: var(--fg); min-width: 12em; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
  margin-right: 4px; vertical-align: -1px; background: var(--c); }
#empty { padding: 24px; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); }
#board { position: relative; overflow-x: auto; padding-bottom: 8px; }
#lines { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; }
#lines line { stroke: var(--line); stroke-width: 1.5; }
#lines line.marked { stroke: var(--mark); stroke-width: 2.5; }
#cols { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(5, minmax(170px, 1fr)); gap: 40px;
  min-width: 1010px; }
.col h2 { position: sticky; top: 0; display: flex; gap: 6px; align-items: baseline; }
.col .count { color: var(--muted); font-weight: 400; }
.list { display: flex; flex-direction: column; gap: 8px; }
.none { margin: 0; color: var(--muted); font-style: italic; }
.node { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--c, var(--unknown));
  border-radius: 6px; padding: 6px 8px; cursor: pointer; transition: opacity .12s; overflow-wrap: anywhere; }
.node:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
.node.gone { border-style: dashed; border-left-style: solid; }
.node .name { font-weight: 600; font-size: 13px; }
.node .label { color: var(--fg); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; }
.node .facts { color: var(--muted); font-size: 11px; margin-top: 2px; }
.s-open { --c: var(--open); } .s-flight { --c: var(--flight); } .s-done { --c: var(--done); }
.s-dropped { --c: var(--dropped); } .s-unknown { --c: var(--unknown); }
.node.selected { box-shadow: 0 0 0 2px var(--mark); }
body.selecting .node:not(.marked) { opacity: .35; }
body.selecting #lines line:not(.marked) { opacity: .2; }
#timeline { margin-top: 20px; }
#bars { display: flex; align-items: flex-end; gap: 1px; height: 64px; border-bottom: 1px solid var(--border); }
#bars .bar { flex: 1 1 0; min-width: 1px; position: relative; background: var(--bar); border-radius: 2px 2px 0 0; }
#bars .bar.empty { background: transparent; }
#bars .bar .sel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--mark); border-radius: 2px 2px 0 0; }
#bars .bar.on { outline: 1px solid var(--mark); }
#axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 2px; }
#selection { margin-top: 20px; }
#sel-label { color: var(--muted); margin: -4px 0 8px; max-width: 70em; }
.scroll { overflow-x: auto; }
#history { border-collapse: collapse; font-size: 12px; min-width: 100%; }
#history th { text-align: left; font-weight: 600; color: var(--muted); padding: 4px 10px 4px 0; white-space: nowrap; }
#history td { padding: 3px 10px 3px 0; vertical-align: top; border-top: 1px solid var(--border); }
#history td.at, #history td.act, #history td.commit, #history td.who { white-space: nowrap; }
#history tr.refused td { color: var(--warn); }
.copy { user-select: all; -webkit-user-select: all; white-space: nowrap; }
</style>
</head>
<body data-view="board">
<header class="top">
  <nav class="parts" aria-label="Partitions"><!--{{PARTITIONS}}--></nav>
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="board" aria-pressed="true">board</button><button type="button" data-view="flow" aria-pressed="false">flow</button><button type="button" data-view="deploys" aria-pressed="false">deploys</button>
  </div>
  <span class="meta mono" id="made"></span>
</header>
<main id="view-board" aria-label="Board">
  <div class="hosts" id="strip" aria-label="Hosts and attention"></div>
  <div class="lanes">
    <section class="lane inception" id="lane-inception" aria-label="Inception"></section>
    <section class="lane plan" id="lane-plan" aria-label="Bolt plan"></section>
    <section class="lane construction" id="lane-construction" aria-label="Construction"></section>
    <section class="lane operation" id="lane-operation" aria-label="Operation"></section>
  </div>
  <div class="scrim" id="scrim"></div>
  <aside class="dock" id="dock" role="dialog" aria-modal="false" aria-labelledby="dk-title" tabindex="-1">
    <div class="dk-h" id="dk-h"></div>
    <div class="dk-b" id="dk-b">
      <section class="word" id="dk-word" aria-label="A word to the item's agent">
        <h3>a word</h3>
        <p class="to" id="dk-to"></p>
        <form id="dk-form"><input type="text" id="dk-text" maxlength="1000" autocomplete="off" aria-label="Your word"><button type="submit" id="dk-send">Send</button></form>
        <p class="said" id="dk-said" role="status" aria-live="polite"></p>
      </section>
    </div>
  </aside>
</main>
<main id="view-deploys" aria-label="Deploys" hidden>
<p class="dp-empty" id="dp-empty" hidden>No deploy and no operation has been recorded.</p>
<div class="dp-envs" id="dp-envs"></div>
</main>
<main id="view-flow" aria-label="Flow" hidden>
<ul id="unreachable"></ul>
<div id="controls">
  <label><input type="checkbox" id="hide"> Hide closed and landed work</label>
  <input type="search" id="find" placeholder="Narrow by name" aria-label="Narrow by name">
  <div class="legend" aria-label="Colours">
    <span class="s-open">open</span><span class="s-flight">in flight</span><span class="s-done">done</span>
    <span class="s-dropped">dropped</span><span class="s-unknown">not known</span>
  </div>
</div>
<p id="empty" hidden>Nothing has been recorded.</p>
<div id="board"><svg id="lines" aria-hidden="true"></svg><div id="cols"></div></div>
<section id="timeline" aria-label="Entries per day">
  <h2>Entries per day</h2>
  <div id="bars"></div>
  <div id="axis"></div>
</section>
<section id="selection">
  <h2 id="sel-title">Select an object to see its history.</h2>
  <p id="sel-label"></p>
  <div class="scroll"><table id="history" hidden>
    <thead><tr><th>When (UTC)</th><th>Act</th><th>Who</th><th>Host</th><th>Commit</th><th>On ← from</th><th>Why</th><th>Session</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</section>
</main>
<script type="application/json" id="data">/*{{DATA}}*/</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var x = document.createElement(tag);
    if (cls) x.className = cls;
    if (text != null) x.textContent = text;
    return x;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // An item that opens a dock: its key, as page.py gave it, when the page holds that dock; a button to the keyboard.
  var DOCKS = D.docks || {};
  function item(x, key) {
    if (!key || !DOCKS[key]) return x;
    x.dataset.dock = key;
    x.tabIndex = 0;
    x.setAttribute("role", "button");
    return x;
  }

  // What the page was made from: when, and the commit of the branch; both commits, should the board's read have
  // found the branch at another.
  var m = D.made;
  $("made").textContent = "as of " + m.at.slice(0, 10) + " " + m.at.slice(11, 16) + "Z · " + m.label + "/main " + m.commit.slice(0, 7)
    + (m.plan && m.plan !== m.commit ? " for the run record, " + m.plan.slice(0, 7) + " for the board and labels" : "")
    + " of " + m.repo + (m.since ? " · since " + m.since : "");

  // ------------------------------------------------------------------------------------------------ the board view
  var B = D.board, readAt = Date.parse(B.read_at);

  // How long before the board was read: a time in its two largest units, as crew says it (14m, 3h 05m, 2d 04h); a
  // date alone in whole days. Null when it is neither.
  function ago(at) {
    if (!at) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(at)) return Math.max(0, Math.floor((readAt - Date.parse(at + "T00:00:00Z")) / 86400000)) + "d";
    var t = Date.parse(at);
    if (isNaN(t)) return null;
    var mins = Math.floor((readAt - t) / 60000);
    if (mins < 1) return "<1m";
    if (mins < 60) return mins + "m";
    var h = Math.floor(mins / 60);
    if (h < 24) return h + "h " + pad(mins % 60) + "m";
    return Math.floor(h / 24) + "d " + pad(h % 24) + "h";
  }
  // A time in the viewer's own zone.
  function local(at) {
    var t = new Date(at);
    if (isNaN(t)) return at || "";
    return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate()) + " " + pad(t.getHours()) + ":" + pad(t.getMinutes());
  }

  // A lane: its head, then sections of objects, each with its weight in the lane's count; the empty line last.
  var LANES = [];
  function lane(id, title, sub, chip) {
    var sec = $(id), h = el("div", "lane-h"), n = el("span", "n");
    h.append(el("h2", null, title), el("span", "sub", sub));
    if (chip) h.append(el("span", chip, chip === "ro" ? "observed" : "gate"));
    h.append(n);
    sec.append(h);
    var L = { sec: sec, n: n, empty: el("div", "empty"), sections: [] };
    LANES.push(L);
    return L;
  }
  function section(L, head) {
    var s = { head: head ? el("div", "sec-h", head) : null, objs: [] };
    if (s.head) L.sec.append(s.head);
    L.sections.push(s);
    return s;
  }
  function obj(s, x, weight) {
    s.objs.push({ el: x, n: weight || 1 });
    return x;
  }

  // Each marker on its object: ✓ an approval, with whether its card is open and who asked it, or, with none open,
  // that Pending You refused its last post, its words in the marker's title after its key; ! for attention.
  // Nothing here answers anything.
  var MARK = { "✓": "approve" };
  function marks(x, ms, attention) {
    var row = el("div", "marks");
    (ms || []).forEach(function (k) {
      var s = el("span", "mark " + (MARK[k.glyph] || ""));
      s.append(el("span", null, k.glyph), el("span", "mk-t", k.card ? "card open, asked by " + k.card.by
                                                            : k.refused ? "no card, its post refused" : "no card"));
      s.title = !k.card && k.refused ? k.key + ": " + k.refused : k.key;
      row.append(s);
    });
    if (attention) row.append(el("span", "mark attention", "! " + attention));
    if (row.childNodes.length) x.append(row);
  }

  // A bolt's units as a chain, in plan order: merged and landed as done links, a unit being built with its stage and
  // tasks, and every other one queued with its stage beside its name; all of them queued for a bolt not started.
  var BUILDING = ["construct", "code", "verify", "settle"], MERGED = ["merged", "landed"];
  function chain(x, units, queued) {
    if (!units.length) return;
    var c = el("div", "lg-chain");
    units.forEach(function (u, i) {
      if (i) c.append(el("span", "lg-arrow", "→"));
      var kind = queued ? "queued" : MERGED.indexOf(u.stage) >= 0 ? "merged" : BUILDING.indexOf(u.stage) >= 0 ? "building" : "queued";
      var link = item(el("div", "lg-unit " + kind), u.dock);
      link.append(el("span", "lg-un", (u.kind === "chore" ? "chore " : "") + u.unit));
      if (kind === "merged") link.title = u.stage;
      if (kind === "queued") link.append(el("span", "lg-ut", u.stage || "unknown"));
      if (kind === "building") {
        var tasks = (u.stage === "code" || u.stage === "verify") && u.tasks ? " " + u.tasks[0] + "/" + u.tasks[1] : "";
        link.append(el("span", "lg-ut", u.stage + tasks));
        if (u.url) link.append(el("span", "lg-at", u.url));
      }
      c.append(link);
    });
    x.append(c);
  }
  // A ledger's head: its repository, its name, then where its work runs and its state.
  function ledgerHead(x, repo, bolt, run) {
    var h = el("div", "lg-head");
    if (repo) h.append(el("span", "lg-repo", repo));
    h.append(el("span", "lg-name", bolt));
    if (run) h.append(el("span", "lg-run", run));
    x.append(h);
  }

  // The hosts the board asked, a silent one marked, then what needs attention.
  var strip = $("strip");
  strip.append(el("span", "lab", "hosts"));
  Object.keys(B.hosts).forEach(function (h) {
    var v = B.hosts[h], pill = el("span", "host" + (v === true ? "" : " gone")), hm = el("span", "hm");
    if (v === true) {
      hm.textContent = "answered";
    } else {
      hm.append(el("b", null, "did not answer"));
      pill.title = v;
    }
    pill.append(el("span", "dot" + (v === true ? "" : " gone")), el("span", "hn", h), hm);
    strip.append(pill);
  });
  var SAID = {
    host: function (a) { return a.name + " did not answer (" + a.why + ")"; },
    plan: function (a) { return "the plan, " + a.name + ": " + a.why; },
    signals: function (a) { return "the signals on " + a.name + ": " + a.why; },
    landed: function (a) { return "bolt " + a.name + ": " + a.why; }
  };
  if (B.attention.length) strip.append(el("span", "sep"));
  B.attention.forEach(function (a) {
    strip.append(el("span", "mark attention", "! " + (SAID[a.what] ? SAID[a.what](a) : a.name + ": " + a.why)));
  });

  // Inception: the signals no move has taken, by who captured them, oldest first; then the explorations.
  var inc = lane("lane-inception", "Inception", "signals not moved · explorations");
  var sigs = section(inc, null), groups = new Map();
  B.inception.signals.forEach(function (s) {
    var k = s.captured_by || "";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  });
  groups.forEach(function (mine, who) {
    var g = el("div", "signals"), oldest = mine.map(function (s) { return ago(s.at); }).filter(Boolean)[0];
    g.append(el("div", "counter", (who || "no one named") + " · " + mine.length + " not moved" + (oldest ? " · oldest " + oldest : "")));
    mine.forEach(function (s) {
      var q = item(el("div", "quote"), s.dock), qm = el("span", "qm");
      q.append(el("q", null, s.first || s.signal));
      qm.append(el("b", null, s.kind || "-"), " · " + (ago(s.at) || "-") + " · ", el("span", "dim", s.signal));
      q.append(qm);
      g.append(q);
    });
    inc.sec.append(obj(sigs, g, mine.length));
  });
  var xps = section(inc, "explorations");
  B.inception.explorations.forEach(function (e) {
    var x = el("div", "xp");
    x.append(el("span", "xp-kit", e.kit), el("span", "xp-n", e.name));
    if (e.first) x.append(el("div", "xp-t", e.first));
    inc.sec.append(obj(xps, x));
  });

  // Bolt plan, the gate: each open proposal a sheet, waiting on the user alone; each planned bolt a ledger not
  // started; each queued unit a slip.
  var bp = lane("lane-plan", "Bolt plan", "proposals · planned bolts · the queue", "gate");
  var sheets = section(bp, null);
  B.bolt_plan.proposals.forEach(function (d) {
    var x = item(el("article", "sheet"), d.dock);
    x.append(el("span", "sh-k", "proposal " + d.proposal), el("div", "sh-title", d.case || "proposal " + d.proposal),
      el("div", "sh-meta", "by " + (d.by || "-") + " · opened " + (d.opened || "-")));
    marks(x, d.markers);
    bp.sec.append(obj(sheets, x));
  });
  var planned = section(bp, "planned");
  B.bolt_plan.planned.forEach(function (b) {
    var x = item(el("div", "ledger"), b.dock);
    ledgerHead(x, b.repo, b.bolt, null);
    if (b.goal) x.title = b.goal;
    chain(x, b.units, true);
    bp.sec.append(obj(planned, x));
  });
  var queue = section(bp, "queue");
  B.bolt_plan.queue.slice().sort(function (a, b) { return (a.repo || "") < (b.repo || "") ? -1 : (a.repo || "") > (b.repo || "") ? 1 : 0; })
    .forEach(function (u) {
      var x = item(el("div", "slip"), u.dock);
      x.append(el("span", "sl-k", u.kind === "chore" ? "chore queued" : "queued"));
      if (u.repo) x.append(el("span", "sl-repo", u.repo));
      x.append(el("span", "sl-n", u.unit));
      if (u.sources.length) x.append(el("span", "sl-to", u.sources.join(", ")));
      bp.sec.append(obj(queue, x));
    });

  // Construction: each started bolt a ledger, headed by its repository, its name, the host and stream its work runs
  // in, as the runner that took it reported them, and its state when it is not active; its units as a chain, its
  // fixes on the machinery row, with no slot; a server only where the board gives one.
  var con = lane("lane-construction", "Construction", "bolts in flight · units in flight");
  var ledgers = section(con, null);
  B.construction.forEach(function (b) {
    var x = item(el("div", "ledger"), b.dock);
    ledgerHead(x, b.repo, b.bolt, [b.host ? "on " + b.host : "", b.stream ? "stream " + b.stream : "", b.state !== "active" ? b.state : ""]
      .filter(Boolean).join(" · "));
    if (b.goal) x.title = b.goal;
    marks(x, b.markers, b.state === "landed" ? "every unit has landed, and the bolt is still in the plan" : null);
    chain(x, b.units);
    b.fixes.forEach(function (f) {
      var r = item(el("div", "lg-mach"), f.dock);
      r.append(el("span", null, f.merged ? "fix merged" : "fix"), el("span", "lg-fn", f.fix));
      if (f.url) r.append(el("span", null, f.url));
      x.append(r);
    });
    if (b.url) {
      var foot = el("div", "lg-foot");
      foot.append(el("span", null, "server"), el("span", "ep", b.url));
      x.append(foot);
    }
    con.sec.append(obj(ledgers, x));
  });

  // Where a deploy stands, in a word for its stamp and a class for its colour.
  function deployStamp(d) {
    if (d.answer === "waiting") return ["waits on your word", "wait"];
    if (d.answer === "replaced") return [d.word ? "replaced, never deployed" : "replaced, unanswered", ""];
    if (d.ended) return [d.outcome || "ended", d.outcome === "failed" ? "failed" : "ok"];
    if (d.started) return ["deploying", "wait"];
    return ["approved", "wait"];
  }
  function from(d) { return !d.from || d.from === "none" ? "from nothing deployed" : "from " + d.from.slice(0, 7); }
  function carries(d) {
    return d.bolts == null ? "carrying what can't be read: " + d.bolts_why : d.bolts.length ? "carrying " + d.bolts.join(", ") : "carrying no landing";
  }
  function waitSaid(w) {
    return w.state === "handed" ? "handed to " + (w.agent || w.doer) : w.state === "failed" ? "failed"
      : w.doer === "user" ? "waits on you" : "waits for " + (w.agent || w.doer || "its doer");
  }

  // Operation, observed: each bolt landed in the last seven days a record, newest first; then each environment's
  // deploys of that week and those still open, newest first, and the operations waiting on it.
  var op = lane("lane-operation", "Operation", "landed and deployed in the last 7 days", "ro");
  var records = section(op, null);
  B.operation.forEach(function (o) {
    var x = item(el("div", "record"), o.dock), h = el("div", "rc-head");
    h.append(el("span", "rc-name", o.bolt), el("span", "rc-at", o.at ? local(o.at) : ""));
    x.append(h, el("span", "rc-stamp", "landed" + (o.by ? " by " + o.by : "")));
    if (o.units.length) x.append(el("div", "rc-env", o.units.join(", ")));
    op.sec.append(obj(records, x));
  });
  (B.environments || []).forEach(function (e) {
    if (!e.deploys.length && !e.waiting.length) return;
    var envs = section(op, e.env);
    e.deploys.forEach(function (d) {

    else openDock(x.dataset.dock, x);
  }
  [$("view-board"), $("view-deploys")].forEach(function (v) {
    v.addEventListener("click", opens);
    v.addEventListener("keydown", function (ev) {
      if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-dock]:not(button)")) {
        ev.preventDefault();
        opens(ev);
      }
    });
  });
  $("scrim").addEventListener("click", closeDock);
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && shown) { ev.preventDefault(); closeDock(); }
  });

  // ------------------------------------------------------------------------------------------------------- the view
  // It is kept in the page's address (#view=flow), so a reload or a page written over this one opens on it, and in the
  // browser for this partition, for when the address names none. The browser may refuse its storage, on a page opened
  // from disk or in a private window; the address alone then keeps it. The dock open is kept in the address too
  // (#dock=<key>), and only there: a reload opens it again, and a key this page holds no dock for is dropped from the
  // address, the board shown with none open.
  var KEY = "crew-page:" + D.label + ":";
  function stored(k) { try { return localStorage.getItem(KEY + k); } catch (e) { return null; } }
  function store(k, v) { try { localStorage.setItem(KEY + k, v); } catch (e) { /* the address keeps it */ } }
  function fragment() {
    var f = {};
    location.hash.replace(/^#/, "").split("&").forEach(function (kv) {
      var i = kv.indexOf("=");
      if (i > 0) {
        try { f[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); } catch (e) { /* not ours */ }
      }
    });
    return f;
  }
  function keep(k, v) {
    var f = fragment();
    f[k] = v;
    var hash = Object.keys(f).filter(function (x) { return f[x]; })
      .map(function (x) { return encodeURIComponent(x) + "=" + encodeURIComponent(f[x]); }).join("&");
    try {
      history.replaceState(null, "", location.pathname + location.search + (hash ? "#" + hash : ""));
    } catch (e) {
      location.replace("#" + hash);
    }
    if (k !== "dock") store(k, v);
  }

  var VIEWS = { board: $("view-board"), flow: $("view-flow"), deploys: $("view-deploys") };
  function view(v) {
    v = VIEWS[v] ? v : "board";
    if (v !== "board") dropDock();
    Object.keys(VIEWS).forEach(function (k) { VIEWS[k].hidden = k !== v; });
    document.body.dataset.view = v;
    document.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.view === v ? "true" : "false"); });
    document.title = D.label + " " + v;
    if (v === "flow") flowShown();
  }
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () { view(b.dataset.view); keep("view", b.dataset.view === "board" ? "" : b.dataset.view); });
  });

  function open() {
    var f = fragment();
    view("view" in f ? f.view : stored("view"));
    if (f.dock && DOCKS[f.dock]) {
      if (f.dock !== shown) openDock(f.dock);
    } else {
      if (f.dock) keep("dock", "");
      dropDock();
    }
  }
  window.addEventListener("hashchange", open);
  open();
})();
</script>
</body>
</html>
