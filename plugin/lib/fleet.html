<!doctype html>
<!-- crew's fleet page: page.py puts the fleet's data in the placeholder below and writes the file whole. It shows each
     Claude subscription first, its use as the host holding its sign-in published it, who read it and how long ago, and
     the sessions and partitions on it; then every partition in the teams file at once, a block to each: where it runs,
     its kits and their mains, and what needs attention. Everything it draws is in this file: no font, script or style
     is loaded from anywhere, and the only links are to each partition's page beside it, and from a subscription to
     its dock there. Every text is set as text, never as markup, a bar's width as a number, and nothing on
     it answers anything. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crew fleet</title>
<style>
/* The colour tokens, light and dark, are page.html's own, copied whole, so the two pages read as one board; a logic
   case holds the blocks equal (tests/py/test_fleet.py). The forms are page.html's too, its header, .host, .dot,
   .sec-h, .empty and .mark. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#16202A; --ink2:#4A5763; --ink3:#7A8794;
  --line:#D5DBE1; --line2:#E4E8EC; --accent:#0B6E79; --accent-ink:#FFFFFF; --accent-soft:#D9EEF0; --accent-hatch:rgba(11,110,121,.10);
  --ok:#2E8B57; --warn:#B7791F; --crit:#B3362B; --lit:#FFF3C4; --lit-line:#E5C34A;
  --shadow:0 10px 30px rgba(22,32,42,.16); --top:46px; --hosts:40px; --dock:600px;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--sans)}
a{color:inherit}
a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
.mono{font-family:var(--mono)}

/* ---------- the header ---------- */
.top{min-height:var(--top);display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;letter-spacing:-.01em}
.top .meta{margin-left:auto;color:var(--ink3);font-size:12px;overflow-wrap:anywhere}

/* ---------- the subscriptions, above the partitions: each one's use, one colour, its bar's width its percentage ---------- */
.subs{padding:14px 14px 0}
.subs > .sec-h{margin-top:0}
.subs-said{display:block;margin-bottom:6px}
.subs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start;margin-top:8px}
.sub{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:1px;padding:10px 12px 12px;box-shadow:3px 3px 0 var(--line2);min-width:0}
.sub-h{border-bottom:1px solid var(--ink);padding-bottom:4px}
.sub-h .sub-name{font:800 15px var(--mono);letter-spacing:-.01em}
.sub-from{display:block;margin-top:5px;font:600 11px var(--mono);color:var(--ink2)}
.sub-from.unread{color:var(--warn)}
.sub-from.none{color:var(--ink3);font-weight:400}
.use{margin-top:8px;font:11.5px var(--mono)}
.use .uw{display:block}
.use .um{display:block;margin-top:6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.bar{height:6px;background:var(--surface2);border:1px solid var(--line);margin:2px 0 5px}
.bar > span{display:block;height:100%;background:var(--accent)}
.others{list-style:none;margin:6px 0 0;padding:0;font:11px var(--mono);color:var(--ink3)}
.others li.unread{color:var(--warn)}
.sub .host{margin-top:2px}
.sub-parts{display:flex;flex-wrap:wrap;gap:4px 12px;font:600 12px var(--mono)}
.sub-parts a:hover{color:var(--accent)}

/* ---------- the partitions, side by side ---------- */
.fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;padding:14px;align-items:start}
.pt{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink2);border-radius:1px;padding:10px 12px 12px;box-shadow:3px 3px 0 var(--line2);min-width:0}
.pt-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;border-bottom:1px solid var(--ink);padding-bottom:4px}
.pt-h .pt-name{font-size:17px;font-weight:800;letter-spacing:-.01em;text-decoration:none}
.pt-h a.pt-name:hover{color:var(--accent)}
.pt-h .pt-of{color:var(--ink3);font-size:12px}
.pt-h .pt-commit{font:11px var(--mono);color:var(--ink3)}
.pt-h .pt-cards{margin-left:auto;font:600 11px var(--mono);color:var(--ink2)}
.sec-h{margin:12px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.empty{color:var(--ink3);font-size:12.5px}
.marks{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.mark{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--surface2)}
.mark.attention{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
/* where it runs: a host as the board's pill, its sessions under it */
.host{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:2px 10px 2px 6px;font-size:12px;max-width:100%}
.host .hn{font:600 12px var(--mono)}
.host .hm{color:var(--ink3)}
.host.gone{border-color:var(--warn)}
.host.gone .hm{color:var(--warn);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.gone{background:var(--crit)}
.dot.unasked{background:var(--ink3)}
.sessions{list-style:none;margin:4px 0 10px;padding:0 0 0 16px;border-left:2px solid var(--line2);font-size:12px}
.sessions li{margin:3px 0}
.sessions .sn{font:600 12px var(--mono)}
.sessions .sa{color:var(--ink2)}
.sessions .acct{display:block;font:11px var(--mono);color:var(--ink3)}
/* a kit and its main */
.kit{padding:4px 0 6px;border-bottom:1px solid var(--line2);font-size:12px}
.kit:last-child{border-bottom:0}
.kit .kn{font:600 12px var(--mono)}
.kit .kl{display:block;color:var(--ink2)}
.pt-h,.pt-name,.host,.sessions,.kit,.mark,.sub-h,.sub-from,.use,.others,.sub-parts{overflow-wrap:anywhere}

@media (max-width:759px){
  .top{gap:6px 8px;padding:6px 10px}
  .top .meta{margin-left:0;flex-basis:100%}
  .fleet{grid-template-columns:1fr;padding:10px;gap:10px}
  .subs{padding:10px 10px 0}
  .subs-grid{grid-template-columns:1fr;gap:10px}
}
</style>
</head>
<body>
<header class="top">
  <h1>crew fleet</h1>
  <span class="meta mono" id="made"></span>
</header>
<section class="subs" aria-labelledby="subs-h">
  <h2 class="sec-h" id="subs-h">subscriptions</h2>
  <span class="empty subs-said" id="subs-said"></span>
  <div class="marks" id="subs-unread"></div>
  <div class="subs-grid" id="subs"></div>
</section>
<main class="fleet" id="fleet" aria-label="Partitions"></main>
<script type="application/json" id="data">/*{{DATA}}*/</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);

  function el(tag, cls, text) {
    var x = document.createElement(tag);
    if (cls) x.className = cls;
    if (text != null) x.textContent = text;
    return x;
  }
  // A link where the data gives one, its text set as text; the same text unlinked where it gives none.
  function link(href, cls, text) {
    if (!href) return el("span", cls, text);
    var a = el("a", cls, text);
    a.setAttribute("href", href);
    return a;
  }
  function line(parent, cls, texts) {
    texts.forEach(function (t) { parent.append(el("span", cls, t)); });
  }

  document.getElementById("made").textContent = "as of " + D.made.at.slice(0, 10) + " " + D.made.at.slice(11, 16) + "Z · run record since "
    + D.made.since.slice(0, 10);

  // The subscriptions: each one's use as its host published it, who read it and how long ago, every other host's
  // reading, then the sessions and partitions on it, set beside its use and made from nothing of it.
  document.getElementById("subs-said").textContent = D.subscriptions.said;
  var unread = document.getElementById("subs-unread");
  D.unread_usage.forEach(function (u) {
    unread.append(el("span", "mark attention", "! the use published in " + u.file + " could not be read: " + u.why));
  });
  var subs = document.getElementById("subs");
  D.subscriptions.items.forEach(function (s) {
    var card = el("section", "sub"), h = el("div", "sub-h");
    card.setAttribute("aria-label", s.account);
    h.append(el("h3", "sub-name", s.account));
    card.append(h, el("span", "sub-from " + s.state, s.said));

    // Its use: a row per window, its words and a plain bar, its width the percentage as a number.
    if (s.windows.length) {
      var use = el("div", "use");
      var row = function (w) {
        use.append(el("span", "uw", w.said));
        if (w.pct === null) return;
        var bar = el("div", "bar"), fill = el("span");
        fill.style.width = Number(w.pct) + "%";
        bar.append(fill);
        use.append(bar);
      };
      s.windows.forEach(row);
      if (s.models.length) use.append(el("span", "um", "by model"));
      s.models.forEach(row);
      card.append(use);
    }
    if (s.others.length) {
      var others = el("ul", "others");
      s.others.forEach(function (o) { others.append(el("li", o.unread ? "unread" : null, o.said)); });
      card.append(others);
    }

    // The sessions on it, by host, each with crew's agents; then the partitions on it, each opening its page at this
    // subscription's dock.
    card.append(el("h4", "sec-h", "sessions"));
    if (!s.sessions.length) card.append(el("span", "empty", s.sessions_said));
    var at = null, ul = null;
    s.sessions.forEach(function (x) {
      if (x.host !== at) {
        at = x.host;
        var pill = el("span", "host");
        pill.append(el("span", "hn", x.host));
        ul = el("ul", "sessions");
        card.append(pill, ul);
      }
      var li = el("li");
      li.append(el("span", "sn", x.session), document.createTextNode(" "), el("span", "sa", x.said));
      ul.append(li);
    });
    card.append(el("h4", "sec-h", "partitions"));
    if (s.partitions.length) {
      var ps = el("div", "sub-parts");
      s.partitions.forEach(function (p) { ps.append(link(p.link, null, p.label)); });
      card.append(ps);
    } else {
      card.append(el("span", "empty", s.partitions_said));
    }
    subs.append(card);
  });

  var fleet = document.getElementById("fleet");
  D.partitions.forEach(function (p) {
    var pt = el("section", "pt");
    pt.setAttribute("aria-label", p.label);

    // Its name, a link to its page; its name in the teams file; its plan's commit; its cards open.
    var h = el("div", "pt-h"), h2 = el("h2");
    h2.append(link(p.link, "pt-name", p.label));
    h.append(h2, el("span", "pt-of", p.partition), el("span", "pt-commit", p.commit), el("span", "pt-cards", p.cards_said));
    pt.append(h);

    // What needs attention, in the board's words.
    var ms = el("div", "marks");
    if (p.attention.length) {
      p.attention.forEach(function (a) { ms.append(el("span", "mark attention", "! " + a)); });
    } else {
      p.attention_said.forEach(function (a) { ms.append(el("span", "empty", a)); });
    }
    pt.append(ms);

    // Where it runs: each host, then the sessions its agents run in, with each one's account.
    pt.append(el("h3", "sec-h", "where it runs"));
    p.hosts.forEach(function (x) {
      var gone = x.answered === false, unasked = x.answered === null;
      var pill = el("span", "host" + (gone ? " gone" : ""));
      pill.append(el("span", "dot" + (gone ? " gone" : unasked ? " unasked" : "")), el("span", "hn", x.host), el("span", "hm", x.said));
      pt.append(pill);
      var ul = el("ul", "sessions");
      x.sessions.forEach(function (s) {
        var li = el("li");
        li.append(el("span", "sn", s.session), document.createTextNode(" "), el("span", "sa", s.agents.join(", ")), el("span", "acct", s.account_said));
        ul.append(li);
      });
      pt.append(ul);
    });

    // Its kits: each one's main's last landing and what is queued for it.
    pt.append(el("h3", "sec-h", "kits"));
    p.kits.forEach(function (k) {
      var row = el("div", "kit");
      row.append(el("span", "kn", k.kit));
      line(row, "kl", k.said);
      pt.append(row);
    });

    fleet.append(pt);
  });
})();
</script>
</body>
</html>
